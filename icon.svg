<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="1" />
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Outer Focus Reticles -->
  <path d="M 100 160 L 100 110 A 10 10 0 0 1 110 100 L 160 100" stroke="#34d399" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M 352 100 L 402 100 A 10 10 0 0 1 412 110 L 412 160" stroke="#34d399" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M 100 352 L 100 402 A 10 10 0 0 0 110 412 L 160 412" stroke="#34d399" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M 352 412 L 402 412 A 10 10 0 0 0 412 402 L 412 352" stroke="#34d399" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- QR Code Finder Pattern Top-Left -->
  <rect x="144" y="144" width="76" height="76" rx="8" fill="none" stroke="#f8fafc" stroke-width="14" />
  <rect x="164" y="164" width="36" height="36" rx="4" fill="#34d399" />

  <!-- QR Code Finder Pattern Top-Right -->
  <rect x="292" y="144" width="76" height="76" rx="8" fill="none" stroke="#f8fafc" stroke-width="14" />
  <rect x="312" y="164" width="36" height="36" rx="4" fill="#34d399" />

  <!-- QR Code Finder Pattern Bottom-Left -->
  <rect x="144" y="292" width="76" height="76" rx="8" fill="none" stroke="#f8fafc" stroke-width="14" />
  <rect x="164" y="312" width="36" height="36" rx="4" fill="#34d399" />

  <!-- Barcode / Data bits in center & bottom-right -->
  <rect x="250" y="148" width="12" height="68" rx="3" fill="#94a3b8" />
  <rect x="148" y="250" width="68" height="12" rx="3" fill="#94a3b8" />
  <rect x="292" y="292" width="22" height="22" rx="3" fill="#f8fafc" />
  <rect x="346" y="292" width="22" height="42" rx="3" fill="#f8fafc" />
  <rect x="292" y="346" width="42" height="22" rx="3" fill="#f8fafc" />
  <rect x="346" y="346" width="22" height="22" rx="3" fill="#34d399" />

  <!-- Center Laser Scan Beam -->
  <rect x="80" y="250" width="352" height="12" rx="6" fill="url(#laser)" />
  <circle cx="256" cy="256" r="5" fill="#ffffff" />
</svg>
